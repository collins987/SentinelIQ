global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'sentineliq'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files (optional)
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # SentinelIQ API metrics
  - job_name: 'sentineliq-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['sentineliq-api:8000']
        labels:
          service: 'api'
          environment: 'development'
    # Fallback if /metrics not available, use /health
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Redis metrics (using redis_exporter pattern)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          environment: 'development'
