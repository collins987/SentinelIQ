services:
  # Backend API
  sentineliq-api:
    build:
      context: ./sentineliq-api
      dockerfile: Dockerfile
    container_name: sentineliq-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sentineliq
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - sentineliq-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend UI
  sentineliq-ui:
    build:
      context: ./sentineliq-ui
      dockerfile: Dockerfile
    container_name: sentineliq-ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_ENABLE_MOCK_DATA=false
    depends_on:
      - sentineliq-api
    networks:
      - sentineliq-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sentineliq-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sentineliq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sentineliq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sentineliq-redis
    ports:
      - "6379:6379"
    networks:
      - sentineliq-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus - Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: sentineliq-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - sentineliq-network
    depends_on:
      - sentineliq-api
      - redis

networks:
  sentineliq-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
